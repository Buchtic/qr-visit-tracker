<!DOCTYPE html>
<html lang="cs">
<head>
<title>Výsledky kampaně</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="../styles.css">
<script src="../charts.js"></script>
<style>
    .metric { text-align:center; }
    .metric .num { font-size:3rem; font-weight:700; line-height:1.1; color:#58a6ff; }
    .metric .lbl { font-size:0.8rem; color:#8b949e; margin-top:4px; }
    .device-bar { height:8px; border-radius:4px; background:#21262d; margin:8px 0 4px; overflow:hidden; display:flex; }
    .device-bar-mob  { background:#3fb950; transition:width .6s ease; }
    .device-bar-desk { background:#58a6ff; transition:width .6s ease; }
    .badge-not-found { background:#f85149; }
    #errorState { display:none; }
    #loadingState { display:block; }
    #mainContent { display:none; }
</style>
</head>
<body class="dark">
<div class="container" style="max-width:800px;">

    <div class="text-end mt-3 mb-2">
        <button id="themeToggle" class="btn btn-outline-light btn-sm">☼</button>
    </div>

    <!-- Loading -->
    <div id="loadingState" class="text-center py-5">
        <div class="spinner-border text-secondary" style="width:2rem;height:2rem;"></div>
        <p class="mt-3" style="color:#8b949e;">Načítám data kampaně&hellip;</p>
    </div>

    <!-- Chyba -->
    <div id="errorState" class="panel text-center py-5">
        <div style="font-size:3rem;">🔍</div>
        <h2 class="mt-3">Kampaň nenalezena</h2>
        <p style="color:#8b949e;">Tento odkaz není platný nebo kampaň byla odstraněna.</p>
        <a href="../" class="btn btn-outline-light btn-sm mt-2">← Zpět na hlavní stránku</a>
    </div>

    <!-- Hlavní obsah -->
    <div id="mainContent">

        <!-- Badge s kontextem kampaně -->
        <div class="text-center mb-3">
            <span style="font-size:0.75rem;color:#8b949e;background:#21262d;border:1px solid #30363d;border-radius:20px;padding:4px 12px;">
                <i class="bi bi-qr-code me-1"></i>Výsledky kampaně
            </span>
        </div>

        <!-- Hlavička -->
        <div class="panel mb-3">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h1 id="campaignName" style="font-size:1.6rem;margin:0;"></h1>
                    <p id="campaignDesc" style="color:#8b949e;margin:6px 0 0;font-size:0.9rem;"></p>
                </div>
                <div style="text-align:right;flex-shrink:0;">
                    <div style="font-size:0.75rem;color:#8b949e;">Spuštěno</div>
                    <div id="campaignStart" style="font-size:0.9rem;font-weight:600;"></div>
                </div>
            </div>
        </div>

        <!-- Metriky -->
        <div class="row g-3 mb-3">
            <div class="col-6 col-md-3">
                <div class="panel metric">
                    <div class="num" id="mTotal">–</div>
                    <div class="lbl">Celkem skenování</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="panel metric">
                    <div class="num" id="mToday">–</div>
                    <div class="lbl">Dnes</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="panel metric">
                    <div class="num" style="color:#3fb950;" id="mMobile">–</div>
                    <div class="lbl">Mobilů</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="panel metric">
                    <div class="num" style="color:#8b949e;" id="mDesktop">–</div>
                    <div class="lbl">Desktopů</div>
                </div>
            </div>
        </div>

        <!-- Device progress bar -->
        <div class="panel mb-3">
            <div class="d-flex justify-content-between" style="font-size:0.8rem;color:#8b949e;margin-bottom:4px;">
                <span><i class="bi bi-phone"></i> Mobil <span id="mobPct"></span></span>
                <span><span id="deskPct"></span> Desktop <i class="bi bi-display"></i></span>
            </div>
            <div class="device-bar">
                <div class="device-bar-mob" id="mobBar" style="width:0%"></div>
                <div class="device-bar-desk" id="deskBar" style="width:0%"></div>
            </div>
        </div>

        <!-- Graf návštěvnosti -->
        <div class="panel mb-3">
            <h2 style="font-size:1rem;">Skenování v čase</h2>
            <canvas id="lineChart" height="100"></canvas>
        </div>

        <!-- Top země -->
        <div class="panel mb-3" id="countryPanel" style="display:none;">
            <h2 style="font-size:1rem;">Top země</h2>
            <div id="countryList" style="font-size:0.85rem;"></div>
        </div>

        <div class="text-center mt-4 mb-3">
            <a href="../" style="color:#8b949e;font-size:0.8rem;text-decoration:none;">
                ← neskenuj.me
            </a>
        </div>

    </div><!-- /mainContent -->
</div>

<script>
document.getElementById("themeToggle").addEventListener("click", () => {
    const isDark = document.body.classList.contains("dark");
    document.body.classList.toggle("dark", !isDark);
    document.body.classList.toggle("light", isDark);
    document.getElementById("themeToggle").textContent = isDark ? "◑" : "☼";
});

// Slug z URL: /kampan/{slug}
const pathParts = location.pathname.replace(/\/+$/, "").split("/");
const slug = pathParts[pathParts.length - 1];

async function loadCampaign() {
    if (!slug || slug === "kampan") {
        showError(); return;
    }

    let data;
    try {
        const res = await fetch(`../api/campaigns/${slug}`);
        if (!res.ok) { showError(); return; }
        data = await res.json();
    } catch { showError(); return; }

    // Metadata
    document.title = `${data.name} – výsledky kampaně`;
    document.getElementById("campaignName").textContent = data.name;
    document.getElementById("campaignDesc").textContent = data.description || "";
    document.getElementById("campaignStart").textContent =
        new Date(data.startDate).toLocaleDateString("cs-CZ");

    // Metriky
    const todayKey = new Date().toISOString().slice(0, 10);
    const todayCount = (data.stats || []).find(s => s.day === todayKey)?.count || 0;
    document.getElementById("mTotal").textContent  = data.total || 0;
    document.getElementById("mToday").textContent  = todayCount;

    const mob  = data.deviceBreakdown?.mobile  || 0;
    const desk = data.deviceBreakdown?.desktop || 0;
    const sum  = mob + desk || 1;
    const mobPct  = Math.round(mob  / sum * 100);
    const deskPct = Math.round(desk / sum * 100);

    document.getElementById("mMobile").textContent  = mob;
    document.getElementById("mDesktop").textContent = desk;
    document.getElementById("mobPct").textContent   = sum > 1 ? mobPct  + " %" : "";
    document.getElementById("deskPct").textContent  = sum > 1 ? deskPct + " %" : "";
    document.getElementById("mobBar").style.width   = mobPct  + "%";
    document.getElementById("deskBar").style.width  = deskPct + "%";

    // Graf
    const isDark = document.body.classList.contains("dark");
    const labelColor = isDark ? "#8b949e" : "#57606a";
    new Chart(document.getElementById("lineChart").getContext("2d"), {
        type: "line",
        data: {
            labels: data.stats.map(s => s.day),
            datasets: [{
                label: "Skenování",
                data: data.stats.map(s => s.count),
                borderColor: "#58a6ff",
                backgroundColor: "rgba(88,166,255,0.15)",
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true, ticks: { color: labelColor }, grid: { color: isDark ? "#21262d" : "#e1e4e8" } },
                x: { ticks: { color: labelColor, maxRotation: 45 }, grid: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });

    // Země
    if (data.countryRanking && data.countryRanking.length > 0) {
        const panel = document.getElementById("countryPanel");
        const list  = document.getElementById("countryList");
        panel.style.display = "";
        const maxC = data.countryRanking[0].count || 1;
        list.innerHTML = data.countryRanking.slice(0, 8).map((item, i) => `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                <span style="font-size:0.72rem;color:#8b949e;width:16px;text-align:right;">${i+1}</span>
                <span style="font-size:1rem;">${countryFlag(item.cc)}</span>
                <span style="font-size:0.8rem;min-width:28px;color:#8b949e;">${item.cc}</span>
                <div style="flex:1;background:#21262d;border-radius:3px;height:5px;overflow:hidden;">
                    <div style="height:100%;background:#58a6ff;border-radius:3px;width:${Math.round(item.count/maxC*100)}%"></div>
                </div>
                <span style="font-size:0.8rem;font-weight:600;min-width:24px;text-align:right;">${item.count}</span>
            </div>
        `).join("");
    }

    // Zobrazit
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("mainContent").style.display  = "";
}

function showError() {
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("errorState").style.display   = "";
}

loadCampaign();
</script>
</body>
</html>
