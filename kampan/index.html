<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Přesměrování…</title>
<script>
    // Přečíst slug z URL: /kampan/{slug}
    const parts = location.pathname.replace(/\/+$/, '').split('/');
    const slug = parts[parts.length - 1];
    if (slug && slug !== 'kampan') {
        location.replace('/?utm_campaign=' + encodeURIComponent(slug));
    } else {
        location.replace('/');
    }
</script>
</head>
<body></body>
</html>
